name: Sync Notion Calendar (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-content-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Notion image dependencies
        run: python -m pip install --disable-pip-version-check --upgrade pillow pillow-heif==1.5.0

      - name: Sync schedule from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          PYTHON_COMMAND: python
        run: node scripts/sync-notion.mjs

      - name: Commit schedule changes
        shell: bash
        run: |
          if git diff --quiet && test -z "$(git status --porcelain)"; then
            echo "予定の変更はありません。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule-notion.json data/schedule.json data/schedule-data.js data/rescene-schedule.ics assets/schedule/notion
          git commit -m "chore: sync schedule from Notion"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
