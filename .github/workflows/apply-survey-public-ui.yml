name: Apply Survey Display Update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-content-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --upgrade pillow

      - name: Apply survey display update
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-survey-public-ui.py
          python scripts/generate-seo.py
          python scripts/sync-site-shell.py
          python scripts/add-image-dimensions.py
          python scripts/generate-pwa.py

          python scripts/apply-survey-public-ui.py --check
          node --check js/survey.js
          node --check scripts/sync-notion-survey.mjs
          python -c 'import json; json.load(open("data/survey-config.json", encoding="utf-8")); json.load(open("data/survey-results.json", encoding="utf-8")); print("Survey JSON OK")'
          python scripts/check-site-links.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && test -z "$(git status --porcelain)"; then
            echo "No survey display changes."
            exit 0
          fi

          git add -A
          git commit -m "chore: refine public survey display"
          git push origin HEAD:main
