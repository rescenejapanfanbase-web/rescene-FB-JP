name: Sync Korean Charts

on:
  workflow_dispatch:
    inputs:
      charts:
        description: 取得対象を限定する場合のみ chart ID をカンマ区切りで入力
        required: false
        type: string
        default: ""
  # このWorkflowファイルを更新した直後にも、リアルタイム4チャートを1回同期する。
  # cron変更時の動作確認と、更新時刻を待たずに復旧させるためのトリガー。
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-korean-charts.yml"
  schedule:
    # Melon / Genie / Bugs / FLO：毎時23分
    # cronを変更することでGitHub側のスケジュール登録を再有効化する。
    - cron: "23 * * * *"
      timezone: "Asia/Tokyo"
    # Melon / Genie / Bugs Daily：前日分の確定後に13時20分
    - cron: "20 13 * * *"
      timezone: "Asia/Tokyo"
    # VIBE：日次ランキング更新後の7時10分
    - cron: "10 7 * * *"
      timezone: "Asia/Tokyo"
    # Spotify Korea：毎日10時20分
    - cron: "20 10 * * *"
      timezone: "Asia/Tokyo"
    # YouTube Music Korea：週次更新を取りこぼさないよう毎日11時30分に確認
    - cron: "30 11 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: rescene-korean-charts-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install source adapter dependencies
        run: python -m pip install --disable-pip-version-check --upgrade yt-dlp beautifulsoup4
      - name: Run offline parser and state tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          PYTHONPATH=scripts python scripts/test-korean-chart-sync.py
          PYTHONPATH=scripts python scripts/test-korean-chart-history.py
          PYTHONPATH=scripts python scripts/test-korean-chart-source-defaults.py
      - name: Resolve scheduled chart set
        id: chart-set
        shell: bash
        env:
          REQUESTED_CHARTS: ${{ inputs.charts || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          charts="${REQUESTED_CHARTS}"
          if [[ -z "${charts}" && "${EVENT_NAME}" == "push" ]]; then
            charts="melon,genie,bugs,flo"
          fi
          if [[ -z "${charts}" && "${EVENT_NAME}" == "schedule" ]]; then
            case "${EVENT_SCHEDULE}" in
              "23 * * * *") charts="melon,genie,bugs,flo" ;;
              "20 13 * * *") charts="melon-daily,genie-daily,bugs-daily" ;;
              "10 7 * * *") charts="vibe" ;;
              "20 10 * * *") charts="spotify-kr" ;;
              "30 11 * * *") charts="youtube-kr" ;;
            esac
          fi
          echo "charts=${charts}" >> "${GITHUB_OUTPUT}"
          echo "取得対象: ${charts:-Notionで有効な全チャート}"
      - name: Fetch, validate, retain stale sources, and publish atomically
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_KOREAN_CHARTS_DATA_SOURCE_ID: ${{ vars.NOTION_KOREAN_CHARTS_DATA_SOURCE_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_KOREA_PLAYLIST_ID: ${{ vars.SPOTIFY_KOREA_PLAYLIST_ID || '37i9dQZEVXbNxXF4SkHj9F' }}
          YOUTUBE_MUSIC_KOREA_PLAYLIST_URL: ${{ vars.YOUTUBE_MUSIC_KOREA_PLAYLIST_URL || 'https://www.youtube.com/playlist?list=PL4fGSI1pDJn6jXS_Tv_N9B8Z0HTRVJE0m' }}
          REQUESTED_CHARTS: ${{ steps.chart-set.outputs.charts }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            git fetch origin "${branch}"
            git reset --hard "origin/${branch}"
            PYTHONPATH=scripts python scripts/sync-korean-charts.py --charts "${REQUESTED_CHARTS}" --attempts 3 --workers 4
            if git diff --quiet -- data/korean-chart-config.json data/korean-charts.json data/korean-charts-data.js data/korean-chart-sync-status.json data/korean-chart-history && \
               test -z "$(git status --porcelain -- data/korean-chart-config.json data/korean-charts.json data/korean-charts-data.js data/korean-chart-sync-status.json data/korean-chart-history)"; then
              exit 0
            fi
            git add data/korean-chart-config.json data/korean-charts.json data/korean-charts-data.js data/korean-chart-sync-status.json data/korean-chart-history
            git commit -m "chore: synchronize Korean charts"
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Report retained chart failures
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/korean-chart-sync-status.json")
          if not path.exists():
              print("::warning::同期ステータスファイルが生成されませんでした。")
              raise SystemExit(0)
          status = json.loads(path.read_text(encoding="utf-8"))
          for chart_id, message in (status.get("failedCharts") or {}).items():
              message = str(message).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title=Korean chart retained: {chart_id}::{message}")
          PY
      - name: Upload Korean chart sync status
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: korean-chart-sync-status
          path: data/korean-chart-sync-status.json
          if-no-files-found: warn
