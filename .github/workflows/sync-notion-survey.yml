name: Sync Notion Survey Results

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: site-content-write
  cancel-in-progress: false

jobs:
  sync-survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --upgrade pillow PyYAML
      - name: Aggregate survey and publish
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SURVEY_DATA_SOURCE_ID: ${{ vars.NOTION_SURVEY_DATA_SOURCE_ID || '19105aab-de7a-4890-b42e-c46108f83bb2' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="main"
          for attempt in 1 2 3; do
            git fetch origin "${branch}"
            git reset --hard "origin/${branch}"

            python scripts/install-survey-integration.py
            node scripts/sync-notion-survey.mjs
            python scripts/generate-seo.py
            python scripts/sync-site-shell.py
            python scripts/add-image-dimensions.py
            python scripts/generate-pwa.py

            node --check scripts/sync-notion-survey.mjs
            node --check js/survey.js
            python -c 'import json; json.load(open("data/survey-config.json", encoding="utf-8")); json.load(open("data/survey-results.json", encoding="utf-8")); print("Survey JSON OK")'
            python scripts/sync-site-shell.py --check
            python scripts/check-site-links.py

            if git diff --quiet && test -z "$(git status --porcelain)"; then
              echo "アンケート集計に変更はありません。"
              exit 0
            fi

            git add -A
            git commit -m "chore: sync Notion survey results"
            if git push origin "HEAD:${branch}"; then exit 0; fi
            echo "Push conflict; retrying (${attempt}/3)"
            sleep $((attempt * 8))
          done
          exit 1
