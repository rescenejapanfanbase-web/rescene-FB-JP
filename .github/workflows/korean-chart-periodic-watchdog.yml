name: Korean Chart Periodic Watchdog

on:
  workflow_dispatch:
    inputs:
      charts:
        description: 確認対象chart ID（カンマ区切り）
        required: true
        type: string
        default: "vibe,spotify-kr,youtube-kr"
      dry_run:
        description: 再実行せず判定だけ行う
        required: false
        type: boolean
        default: false
  schedule:
    # UTC基準。12:42 JST/KST：Genie Daily / Bugs Daily
    - cron: "42 3 * * *"
    # 13:22 JST/KST：Melon Daily
    - cron: "22 4 * * *"
    # 07:50 JST/KST：VIBE
    - cron: "50 22 * * *"
    # 10:55 JST/KST：Spotify Korea
    - cron: "55 1 * * *"
    # 12:05 JST/KST：YouTube Music Korea
    - cron: "5 3 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: korean-chart-periodic-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve periodic source
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          MANUAL_CHARTS: ${{ github.event.inputs.charts || '' }}
        run: |
          set -euo pipefail
          charts="${MANUAL_CHARTS}"

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            case "${EVENT_SCHEDULE}" in
              "42 3 * * *") charts="genie-daily,bugs-daily" ;;
              "22 4 * * *") charts="melon-daily" ;;
              "50 22 * * *") charts="vibe" ;;
              "55 1 * * *") charts="spotify-kr" ;;
              "5 3 * * *") charts="youtube-kr" ;;
              *)
                echo "::error::未定義のperiodic scheduleです: ${EVENT_SCHEDULE}"
                exit 2
                ;;
            esac
          fi

          echo "charts=${charts}" >> "${GITHUB_OUTPUT}"
          echo "確認対象: ${charts}"

      - name: Detect stale periodic source and dispatch recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WATCHDOG_BRANCH: ${{ github.event.repository.default_branch }}
          WATCHDOG_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          WATCHDOG_CHARTS: ${{ steps.target.outputs.charts }}
          WATCHDOG_FRESH_MINUTES: "180"
        run: python scripts/korean-chart-watchdog.py
