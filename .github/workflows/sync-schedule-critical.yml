name: Critical Schedule Sync

on:
  workflow_dispatch:
  schedule:
    # 他の実行と独立した重要枠: JST 06:00 / 18:00
    - cron: "0 6,18 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: rescene-schedule-write
  cancel-in-progress: false

jobs:
  sync-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install schedule dependencies
        run: python -m pip install --disable-pip-version-check --upgrade pillow pillow-heif==1.5.0 pyyaml playwright
      - name: Run protected schedule synchronization
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          SITE_BASE_URL: https://rescene-fb.jp
          PYTHON_COMMAND: python
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            echo "重要スケジュール同期 ${attempt}/5"
            git fetch origin "${branch}"
            git reset --hard "origin/${branch}"
            if bash scripts/sync-schedule-content.sh; then
              if git diff --quiet && test -z "$(git status --porcelain)"; then exit 0; fi
              git add -A
              git commit -m "chore: critical schedule sync"
              if git push origin "HEAD:${branch}"; then exit 0; fi
            fi
            sleep $((attempt * 15))
          done
          exit 1
