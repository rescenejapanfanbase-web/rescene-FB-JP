name: Sync Schedule

on:
  workflow_dispatch:
  schedule:
    # 日本時間 00:00 / 06:00 / 12:00 / 18:00。
    - cron: "0 0,6,12,18 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: site-content-write
  cancel-in-progress: false

jobs:
  sync-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install schedule sync and validation dependencies
        run: python -m pip install --disable-pip-version-check --upgrade pillow pillow-heif==1.5.0 pyyaml playwright

      - name: Verify HEIC conversion support
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pillow_heif import register_heif_opener

          register_heif_opener()
          print(f"HEIC変換準備完了: Pillow {Image.__version__}")
          PY

      - name: Verify Plus Chat browser support
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1; then
            echo "Plus Chat取得ブラウザ: GitHub RunnerのGoogle Chromeを使用します。"
            google-chrome --version 2>/dev/null || google-chrome-stable --version
          else
            echo "Google Chromeが見つからないためPlaywright Chromiumを準備します。"
            python -m playwright install --with-deps chromium
          fi

      - name: Synchronize, validate, and publish schedule atomically
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          SITE_BASE_URL: https://rescene-fb.jp
          PYTHON_COMMAND: python
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"
          echo "スケジュール予定時刻: JST 00:00 / 06:00 / 12:00 / 18:00"
          echo "実行開始: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S %Z')"

          for attempt in 1 2 3; do
            echo "スケジュール同期を実行します（${attempt}/3）"
            git fetch origin "${branch}"
            git reset --hard "origin/${branch}"

            bash ./scripts/sync-schedule-content.sh

            if git diff --quiet && test -z "$(git status --porcelain)"; then
              echo "公開スケジュールに変更はありません。"
              exit 0
            fi

            git add -A
            git commit -m "chore: synchronize schedule"
            if git push origin "HEAD:${branch}"; then
              echo "スケジュールを1コミットで更新しました。"
              exit 0
            fi

            echo "push中に別の更新が入りました。最新状態から再実行します。"
            sleep $((attempt * 8))
          done

          echo "3回試行しましたがスケジュール同期を反映できませんでした。"
          exit 1

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schedule-quality-report
          path: data/quality-report.json
          if-no-files-found: warn
