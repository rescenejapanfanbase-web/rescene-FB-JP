name: Korean Chart Watchdog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 再実行せず判定だけ行う
        required: false
        type: boolean
        default: false
  schedule:
    # UTC基準。日本・韓国時間でも毎時27分
    - cron: "27 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: korean-chart-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Detect stale hourly sources and dispatch recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WATCHDOG_BRANCH: ${{ github.event.repository.default_branch }}
          WATCHDOG_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          WATCHDOG_CHARTS: melon,genie,bugs,flo
          WATCHDOG_FRESH_MINUTES: "75"
        run: python scripts/korean-chart-watchdog.py
