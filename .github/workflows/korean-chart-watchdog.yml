name: Korean Chart Watchdog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 再実行せず判定だけ行う
        required: false
        type: boolean
        default: false
  schedule:
    # リアルタイム同期（毎時23分）の30分後に確認
    # cronを変更してGitHub側のWatchdogスケジュールも再登録する。
    - cron: "53 * * * *"
      timezone: "Asia/Tokyo"

permissions:
  actions: write
  contents: read

concurrency:
  group: korean-chart-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Detect stale hourly sources and dispatch recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WATCHDOG_BRANCH: ${{ github.event.repository.default_branch }}
          WATCHDOG_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          WATCHDOG_CHARTS: melon,genie,bugs,flo
          WATCHDOG_FRESH_MINUTES: "100"
        run: python scripts/korean-chart-watchdog.py
