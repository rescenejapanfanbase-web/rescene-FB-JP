name: Critical YouTube Sync

on:
  workflow_dispatch:
  schedule:
    # 他の実行が失敗していても独立して動かす重要枠: JST 00:05 / 18:05 / 20:05 / 22:05
    - cron: "5 0,18,20,22 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: rescene-youtube-write
  cancel-in-progress: false

jobs:
  sync-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install YouTube extractor
        run: python -m pip install --disable-pip-version-check --upgrade yt-dlp
      - name: Run protected YouTube synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"
          echo "重要YouTube同期: JST 00:05 / 18:05 / 20:05 / 22:05"
          for attempt in 1 2 3 4 5; do
            echo "重要枠の同期試行 ${attempt}/5"
            git fetch origin "${branch}"
            git reset --hard "origin/${branch}"
            if node scripts/sync-youtube-channels.mjs; then
              if git diff --quiet -- data/youtube-channels.json; then exit 0; fi
              git add data/youtube-channels.json
              git commit -m "chore: critical YouTube sync"
              if git push origin "HEAD:${branch}"; then exit 0; fi
            fi
            sleep $((attempt * 15))
          done
          echo "重要YouTube同期を5回試行しましたが反映できませんでした。"
          exit 1
