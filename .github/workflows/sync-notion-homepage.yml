name: Sync Notion Homepage Content

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-homepage-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Sync homepage content and images from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_HOMEPAGE_DATA_SOURCE_ID: ${{ vars.NOTION_HOMEPAGE_DATA_SOURCE_ID }}
        run: node scripts/sync-notion-homepage.mjs

      - name: Rebuild managed navigation, languages, updates, and PWA
        run: |
          node scripts/build-language-catalog.mjs
          python scripts/generate-site-updates.py
          python scripts/sync-site-shell.py
          python scripts/generate-pwa.py

      - name: Commit homepage changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 画像の追加・差し替え・旧ハッシュ画像の削除も必ずコミット対象へ含める。
          git add -A

          if git diff --cached --quiet; then
            echo "ホーム・共通表示の変更はありません。"
            exit 0
          fi

          git commit -m "chore: sync homepage content and images from Notion"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
