name: Sync Notion Music Records

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-content-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check --upgrade pillow
      - name: Ensure HEIC conversion support
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 && ! command -v heif-convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Sync records and publish
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_RECORDS_DATA_SOURCE_ID: ${{ vars.NOTION_RECORDS_DATA_SOURCE_ID }}
          PYTHON_COMMAND: python
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/sync-notion-records.mjs
          python scripts/generate-seo.py
          python scripts/sync-site-shell.py
          python scripts/add-image-dimensions.py
          python scripts/generate-pwa.py
          bash scripts/run-prepublish-checks.sh
          if git diff --quiet && test -z "$(git status --porcelain)"; then
            echo "音楽記録に変更はありません。"
            exit 0
          fi
          git add -A
          git commit -m "chore: sync Notion music records"
          git push
