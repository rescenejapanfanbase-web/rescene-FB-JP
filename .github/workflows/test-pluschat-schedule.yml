name: Test Plus Chat Schedule Import

on:
  workflow_dispatch:
    inputs:
      year:
        description: "取得する年（例: 2026）"
        required: true
        default: "2026"
      month:
        description: "取得する月（01〜12）"
        required: true
        default: "07"

permissions:
  contents: read

jobs:
  test-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Fetch and parse Plus Chat schedule
        run: |
          python scripts/sync-pluschat-schedule.py \
            --year "${{ inputs.year }}" \
            --month "${{ inputs.month }}"

      - name: Show preview JSON
        if: always()
        run: |
          if test -f data/pluschat-schedule-preview.json; then
            cat data/pluschat-schedule-preview.json
          fi

      - name: Upload trial result and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pluschat-schedule-${{ inputs.year }}-${{ inputs.month }}
          path: |
            data/pluschat-schedule-preview.json
            data/pluschat-diagnostics/
          if-no-files-found: warn
