name: Critical Site Content Sync

on:
  workflow_dispatch:
  schedule:
    # 他の実行と独立した重要枠: JST 07:05 / 13:05 / 19:05 / 23:05
    - cron: "5 7,13,19,23 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: rescene-other-content-write
  cancel-in-progress: false

jobs:
  sync-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --upgrade pillow pillow-heif==1.5.0 pyyaml yt-dlp playwright
      - name: Run protected site synchronization
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          NOTION_NEWS_DATA_SOURCE_ID: ${{ vars.NOTION_NEWS_DATA_SOURCE_ID }}
          NOTION_DISCOGRAPHY_DATA_SOURCE_ID: ${{ vars.NOTION_DISCOGRAPHY_DATA_SOURCE_ID }}
          NOTION_CHANTS_DATA_SOURCE_ID: ${{ vars.NOTION_CHANTS_DATA_SOURCE_ID }}
          NOTION_MV_DATA_SOURCE_ID: ${{ vars.NOTION_MV_DATA_SOURCE_ID }}
          NOTION_VOTING_DATA_SOURCE_ID: ${{ vars.NOTION_VOTING_DATA_SOURCE_ID }}
          NOTION_STREAMING_DATA_SOURCE_ID: ${{ vars.NOTION_STREAMING_DATA_SOURCE_ID }}
          NOTION_MEMBERS_DATA_SOURCE_ID: ${{ vars.NOTION_MEMBERS_DATA_SOURCE_ID }}
          NOTION_ABOUT_DATA_SOURCE_ID: ${{ vars.NOTION_ABOUT_DATA_SOURCE_ID }}
          NOTION_OFFICIAL_LINKS_DATA_SOURCE_ID: ${{ vars.NOTION_OFFICIAL_LINKS_DATA_SOURCE_ID }}
          NOTION_CONTACT_DATA_SOURCE_ID: ${{ vars.NOTION_CONTACT_DATA_SOURCE_ID }}
          NOTION_HOMEPAGE_DATA_SOURCE_ID: ${{ vars.NOTION_HOMEPAGE_DATA_SOURCE_ID }}
          NOTION_RECORDS_DATA_SOURCE_ID: ${{ vars.NOTION_RECORDS_DATA_SOURCE_ID }}
          SITE_BASE_URL: https://rescene-fb.jp
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          PYTHON_COMMAND: python
          PYTHONDONTWRITEBYTECODE: "1"
          SKIP_YOUTUBE_SYNC: "1"
          SKIP_SCHEDULE_SYNC: "1"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            echo "重要全体同期 ${attempt}/5"
            git fetch origin "${branch}"
            git reset --hard "origin/${branch}"
            if bash scripts/sync-all-content.sh; then
              if git diff --quiet && test -z "$(git status --porcelain)"; then exit 0; fi
              git add -A
              git commit -m "chore: critical full content sync"
              if git push origin "HEAD:${branch}"; then exit 0; fi
            fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: critical-site-quality-report
          path: data/quality-report.json
          if-no-files-found: warn
